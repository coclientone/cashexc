<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Payments | Cashex Smart Transfer</title>
  <style>
    :root{--muted:#63748a;--blue:#1769e0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;margin:0;background:#f5f8fc;color:#10243d}
    .container{max-width:980px;margin:24px auto;padding:0 20px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .user{display:flex;gap:12px;align-items:center}
    .avatar{width:44px;height:44px;border-radius:50%;background:#21b7c9;color:white;display:flex;align-items:center;justify-content:center;font-weight:700}
    .card{background:white;padding:20px;border-radius:12px;border:1px solid #e6eef8}
    .row{display:flex;gap:18px}
    .col{flex:1}
    label{font-weight:600;font-size:13px}
    input,select{width:100%;padding:10px;border:1px solid #e6eef8;border-radius:8px;margin-top:8px}
    .btn{padding:12px 14px;border-radius:8px;border:none;cursor:pointer}
    .primary{background:var(--blue);color:#fff}
    .secondary{background:#fff;color:var(--blue);border:1px solid var(--blue)}
    .hint{color:var(--muted);font-size:13px;margin-top:8px}
    .disabled{opacity:0.5;pointer-events:none}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>Payments Dashboard</h2>
      <div class="user" id="user-area">
        <a href="signup.html" style="font-size:13px;color:var(--muted);text-decoration:none;margin-right:12px">Create account</a>
        <div id="user-info"></div>
      </div>
    </header>

    <div class="card">
      <h3>Send Money</h3>
      <p class="hint">You must have a Cashex account to send or receive payments. Create one if you haven't.</p>

      <div id="not-setup" style="display:none;color:#92400e;margin-bottom:12px">Your account is not set up. Please <a href="signup.html">create an account</a> first.</div>

      <div id="send-section">
        <div class="row">
          <div class="col">
            <label for="send-amount">Amount (USD)</label>
            <input id="send-amount" type="number" min="1" step="0.01" value="100">
          </div>
          <div class="col">
            <label for="send-currency">Currency</label>
            <select id="send-currency"><option value="USD">USD</option><option value="EUR">EUR</option><option value="PKR">PKR</option></select>
          </div>
        </div>

        <div style="margin-top:12px">
          <label for="recipient-name">Recipient name</label>
          <input id="recipient-name" placeholder="Recipient full name">
        </div>
        <div style="margin-top:12px">
          <label for="recipient-account">Recipient IBAN / Account</label>
          <input id="recipient-account" placeholder="PK12... or account number">
        </div>

        <div style="margin-top:14px;display:flex;gap:10px">
          <button id="card-pay-btn" class="btn primary">Pay with Card (Stripe)</button>
          <button id="bank-pay-btn" class="btn secondary">Send Bank Transfer (Wise)</button>
        </div>

        <div id="send-message" style="margin-top:12px"></div>
      </div>
    </div>

    <div style="height:18px"></div>

    <div class="card">
      <h3>Receive Money</h3>
      <p class="hint">Share your receiving account details with senders so they can pay you.</p>
      <div id="receive-area">
        <div id="receive-info"></div>
        <div style="margin-top:12px"><button id="copy-receive" class="btn secondary">Copy receiving details</button></div>
      </div>
    </div>
  </div>

  <script>
    // Basic client-side user state management (demo). In production, use server-authenticated user sessions.
    const userKey = 'cashexc_user';
    const userArea = document.getElementById('user-area');
    const userInfo = document.getElementById('user-info');
    const notSetup = document.getElementById('not-setup');
    const sendSection = document.getElementById('send-section');
    const receiveInfo = document.getElementById('receive-info');
    const copyBtn = document.getElementById('copy-receive');
    const cardBtn = document.getElementById('card-pay-btn');
    const bankBtn = document.getElementById('bank-pay-btn');
    const sendMessage = document.getElementById('send-message');

    function getUser() {
      try { return JSON.parse(localStorage.getItem(userKey)); } catch(e){return null}
    }

    function render() {
      const user = getUser();
      if (!user) {
        userInfo.innerHTML = `<a href=\"signup.html\">Sign up</a>`;
        notSetup.style.display = 'block';
        sendSection.classList.add('disabled');
        receiveInfo.innerHTML = '<div style="color:var(--muted)">No receiving account set. Add one when you sign up.</div>';
        return;
      }

      notSetup.style.display = 'none';
      sendSection.classList.remove('disabled');
      userInfo.innerHTML = `<div style=\"display:flex;align-items:center;gap:10px\"><div class=\"avatar\">${user.name[0].toUpperCase()}</div><div><div style=\"font-weight:700\">${user.name}</div><div style=\"font-size:12px;color:var(--muted)\">${user.email}</div></div></div>`;
      const recv = user.receiveAccount || '(not provided)';
      receiveInfo.innerHTML = `<div><strong>Receiving account:</strong> <span style=\"color:var(--muted)\">${recv}</span></div>`;
    }

    render();

    copyBtn.addEventListener('click', () => {
      const user = getUser(); if (!user || !user.receiveAccount) return alert('No receiving account to copy.');
      navigator.clipboard.writeText(user.receiveAccount).then(() => alert('Copied receiving details to clipboard.'));
    });

    // Redirect to Stripe Elements page for card payment with prefilled params
    cardBtn.addEventListener('click', () => {
      const user = getUser(); if (!user) return alert('Create an account first.');
      const amount = document.getElementById('send-amount').value;
      const recipientName = document.getElementById('recipient-name').value || '';
      const recipientAccount = document.getElementById('recipient-account').value || '';
      const params = new URLSearchParams({ amount, recipientName, recipientAccount });
      window.location.href = `stripe-card-payment.html?${params.toString()}`;
    });

    // Bank transfer via Wise directly from dashboard (server must have WISE configured)
    bankBtn.addEventListener('click', async () => {
      const user = getUser(); if (!user) return alert('Create an account first.');
      sendMessage.textContent = '';
      const amount = document.getElementById('send-amount').value;
      const recipientName = document.getElementById('recipient-name').value;
      const recipientAccount = document.getElementById('recipient-account').value;
      if (!amount || !recipientName || !recipientAccount) { sendMessage.textContent = 'Amount, recipient name and account are required.'; return; }

      try {
        sendMessage.textContent = 'Starting secure card payment flow (you will be redirected)...';
        // For bank transfers that require funds, we use Stripe Elements page (card) which will call transfer execute after successful payment.
        const params = new URLSearchParams({ amount, recipientName, recipientAccount });
        window.location.href = `stripe-card-payment.html?${params.toString()}`;
      } catch (err) {
        sendMessage.textContent = 'Failed to start transfer: ' + (err.message || err);
      }
    });

    // Pre-fill form fields if stripe-card-payment redirect returned
    (function prefillFromQuery(){
      const qs = new URLSearchParams(window.location.search);
      const a = qs.get('amount'); if (a) document.getElementById('send-amount').value = a;
      const rn = qs.get('recipientName'); if (rn) document.getElementById('recipient-name').value = rn;
      const ra = qs.get('recipientAccount'); if (ra) document.getElementById('recipient-account').value = ra;
    })();
  </script>
</body>
</html>

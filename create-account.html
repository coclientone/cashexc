<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=signup.html">
  <title>Create an account | Cashex</title>
  <style>
    :root { --navy: #081b33; --blue: #1769e0; --bg: #f5f8fc; --muted: #63748a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, system-ui, sans-serif; color: var(--navy); background: var(--bg); }
    main { width: min(100%, 520px); padding: 44px 36px; text-align: center; background: #fff; border: 1px solid #e5ebf3; border-radius: 18px; box-shadow: 0 18px 45px rgba(25, 59, 101, .08); }
    h1 { margin: 0 0 12px; }
    p { margin: 0 0 24px; color: var(--muted); }
    a { display: inline-block; padding: 12px 20px; color: #fff; background: var(--blue); border-radius: 10px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p>Continue to the Cashex signup page to create your account.</p>
    <a href="signup.html">Create an account</a>
  </main>
</body>
</html>

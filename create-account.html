<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=signup.html">
  <title>Create an account | Cashex</title>
  <style>
    :root { --navy:#081b33; --blue:#1769e0; --muted:#63748a; --bg:#f5f8fc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,system-ui,sans-serif; color:var(--navy); background:var(--bg); }
    main { width:min(100%,560px); padding:40px 32px; text-align:center; background:#fff; border:1px solid #e5ebf3; border-radius:18px; box-shadow:0 18px 45px rgba(25,59,101,.08); }
    h1 { margin:0 0 12px; }
    p { margin:0 0 22px; color:var(--muted); }
    nav { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
    a { display:inline-block; padding:12px 18px; color:#fff; background:var(--blue); border-radius:10px; font-weight:700; text-decoration:none; }
    a.secondary { color:var(--blue); background:#eef4ff; }
  </style>
  <script>window.location.replace('signup.html');</script>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p>Opening the Cashex signup page. Use the links below if automatic navigation is disabled.</p>
    <nav aria-label="Account navigation">
      <a href="signup.html">Sign up</a>
      <a class="secondary" href="login.html">Log in</a>
      <a class="secondary" href="index.html">Home</a>
      <a class="secondary" href="dashboard.html">Dashboard</a>
    </nav>
  </main>
</body>
</html>

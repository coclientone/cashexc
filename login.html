<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Cashex</title><style>:root{--blue:#1769e0;--ink:#10243d;--muted:#63748a;--bg:#f5f8fc;--card:#fff;--line:#e5ebf3;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}.container{max-width:520px;margin:auto;padding:0 22px}header{background:#081b33;color:#fff}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800}.logo span{color:#35c4d5}.nav a{color:#d9e5f3;font-size:14px}main{padding:80px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 18px 45px #193b6514}h1{margin:0 0 8px}.sub,.note{color:var(--muted)}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:13px 14px;border:1px solid #cdd8e5;border-radius:9px;font:inherit}.button{width:100%;border:0;border-radius:10px;padding:14px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer}.button:disabled{opacity:.7}.error{color:var(--danger);font-size:13px;margin-top:12px}</style></head><body><header><div class="container nav"><a class="logo" href="index.html">Cash<span>ex</span></a><a href="signup.html">Create account</a></div></header><main><div class="container"><section class="card"><h1>Welcome back</h1><p class="sub">Sign in to manage your transfers and account details.</p><form id="login-form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">Sign in</button><p id="message" class="error" aria-live="polite"></p></form><p class="note"><a href="signup.html">Need an account? Create one</a></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const form=document.getElementById('login-form'),message=document.getElementById('message'),button=form.querySelector('button');form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';const config=window.CASHEXC_CONFIG||{};if(!config.supabaseUrl||!config.supabaseAnonKey||config.supabaseUrl.includes('YOUR_')||config.supabaseAnonKey.includes('YOUR_')){message.textContent='Supabase is not configured.';return}button.disabled=true;button.textContent='Signing in...';try{const client=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey),{error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;location.href='dashboard.html'}catch(error){message.textContent=error.message||'Unable to sign in.'}finally{button.disabled=false;button.textContent='Sign in'}});</script></body></html>

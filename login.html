<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cashex login</title><style>body{font-family:system-ui;max-width:480px;margin:50px auto;padding:20px}.card{padding:24px;border:1px solid #ddd;border-radius:12px}label{display:block;margin-top:14px}input{width:100%;padding:11px;margin-top:5px;box-sizing:border-box}button{margin-top:18px;padding:12px 18px;background:#1769e0;color:#fff;border:0;border-radius:8px;font-weight:700}#msg{margin-top:14px}</style></head><body><main class="card"><h1>Log in to Cashex</h1><form id="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Log in</button></form><p id="msg"></p><a href="signup.html">Create an account</a></main><script>const API=window.CASHEXC_API_BASE||'http://localhost:4242';form.onsubmit=async e=>{e.preventDefault();const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){msg.textContent=d.error;return}localStorage.setItem('cashexc_token',d.token);localStorage.setItem('cashexc_user',JSON.stringify(d.user));location.href='dashboard-payments.html'}</script></body></html>

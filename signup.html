<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cashex — Sign up</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:40px}
    .card{max-width:560px;margin:auto;padding:24px;border:1px solid #eee;border-radius:12px}
    label{display:block;margin-top:12px;font-weight:600}
    input{width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:8px}
    button{margin-top:18px;padding:12px 16px;border-radius:8px;background:#1769e0;color:white;border:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>Create your Cashex account</h1>
    <p style="color:#666">Quick demo signup — this stores a local demo account. For production replace with real backend user creation.</p>

    <form id="signup-form">
      <label for="full-name">Full name</label>
      <input id="full-name" type="text" required placeholder="John Doe">

      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@example.com">

      <label for="receive-account">Default receiving account (IBAN / Account)</label>
      <input id="receive-account" type="text" placeholder="PK12EXPL... or wallet id (optional)">

      <button type="submit">Create Account</button>
    </form>

    <div id="notice" style="margin-top:12px;color:#064e3b;display:none"></div>
  </main>

  <script>
    // Demo signup: store a local user object. Replace with server-side call in production.
    const form = document.getElementById('signup-form');
    const notice = document.getElementById('notice');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('full-name').value.trim();
      const email = document.getElementById('email').value.trim();
      const receive = document.getElementById('receive-account').value.trim();

      if (!name || !email) {
        notice.textContent = 'Name and email are required.'; notice.style.display = 'block'; return;
      }

      const user = {
        id: 'user_' + Math.random().toString(36).slice(2, 10),
        name,
        email,
        receiveAccount: receive || '',
        createdAt: new Date().toISOString()
      };

      localStorage.setItem('cashexc_user', JSON.stringify(user));
      notice.textContent = 'Account created. Redirecting to dashboard...'; notice.style.display = 'block';

      setTimeout(() => window.location.href = 'dashboard-payments.html', 800);
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard | Cashex</title>
  <style>
    :root{
      --primary:#1769e0;--ink:#fff;--ink-secondary:#e0e0e0;--muted:#9ca3af;--bg:#0f0f1e;--bg-secondary:#1a1a2e;--card:#16213e;--line:#2d2d44;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--cyan:#06b6d4
    }
    *{box-sizing:border-box} 
    body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
    a{text-decoration:none;color:inherit}
    .container{max-width:1400px;margin:0 auto;padding:0 20px}
    
    .button{display:inline-block;background:rgba(23,105,224,0.2);color:var(--primary);padding:12px 20px;border-radius:10px;border:1px solid var(--primary);cursor:pointer;font:inherit;transition:all 0.2s}
    .button:hover{background:var(--primary);color:#fff}
    .button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
    .button.primary:hover{background:#1256c0}
    .button.success{background:rgba(16,185,129,0.2);color:var(--success);border-color:var(--success)}
    .button.success:hover{background:var(--success);color:var(--bg)}
    .button.secondary{background:transparent;border:1px solid var(--line)}
    .button.secondary:hover{background:var(--line)}

    header{background:linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);border-bottom:1px solid var(--line);padding:16px 0;position:sticky;top:0;z-index:100}
    .nav{height:60px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-size:24px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg, var(--primary), var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    
    main{padding:32px 0}
    
    .dashboard-top{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:32px}
    .balance-card{background:linear-gradient(135deg, var(--primary) 0%, #0ea5e9 100%);border-radius:20px;padding:36px;color:#fff;box-shadow:0 20px 60px rgba(23,105,224,0.4)}
    .balance-label{font-size:14px;text-transform:uppercase;letter-spacing:1px;opacity:0.9;margin-bottom:8px}
    .balance-amount{font-size:48px;font-weight:900;margin-bottom:24px;letter-spacing:-1px}
    .balance-footer{display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid rgba(255,255,255,0.2)}
    .balance-footer-item{font-size:12px;opacity:0.85}
    .balance-footer-item strong{display:block;font-size:16px;margin-top:4px}

    .quick-stats{display:grid;grid-template-columns:1fr;gap:16px}
    .stat-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
    .stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
    .stat-value{font-size:28px;font-weight:700;color:var(--primary)}
    .stat-box.sent .stat-value{color:var(--danger)}
    .stat-box.received .stat-value{color:var(--success)}

    .main-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;margin-bottom:32px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}

    h2{font-size:20px;margin:0 0 20px;font-weight:700;color:var(--ink)}
    h3{font-size:16px;margin:0 0 16px;font-weight:600;color:var(--ink)}

    .tabs{display:flex;gap:12px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:12px}
    .tab{padding:8px 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;font-weight:500;border-bottom:2px solid transparent;transition:all 0.2s}
    .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .tab:hover{color:var(--ink-secondary)}

    .transfer-form{display:grid;gap:14px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    input, select, textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:11px 12px;border-radius:10px;font:inherit}
    input:focus, select:focus, textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(23,105,224,0.1)}
    .row{display:flex;gap:12px}

    .history-filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .filter-btn{padding:6px 14px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:all 0.2s}
    .filter-btn:hover{border-color:var(--primary);color:var(--primary)}
    .filter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

    .transaction-list{display:flex;flex-direction:column;gap:12px;max-height:600px;overflow-y:auto}
    .transaction-item{display:flex;align-items:center;gap:14px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;transition:all 0.2s}
    .transaction-item:hover{border-color:var(--primary);background:rgba(23,105,224,0.05)}
    
    .tx-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
    .tx-icon.sent{background:rgba(239,68,68,0.2);color:var(--danger)}
    .tx-icon.received{background:rgba(16,185,129,0.2);color:var(--success)}
    
    .tx-info{flex:1}
    .tx-name{font-weight:600;font-size:13px;color:var(--ink)}
    .tx-desc{font-size:12px;color:var(--muted);margin-top:2px}
    .tx-date{font-size:11px;color:var(--muted);margin-top:4px}
    
    .tx-amount{text-align:right}
    .tx-amount-value{font-weight:700;font-size:14px;margin-bottom:4px}
    .tx-amount.sent .tx-amount-value{color:var(--danger)}
    .tx-amount.received .tx-amount-value{color:var(--success)}
    .tx-currency{font-size:11px;color:var(--muted)}

    .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:0.4}
    .empty-state p{margin:0}

    .mini-form{display:grid;gap:12px;margin-top:16px}
    .mini-actions{display:flex;justify-content:space-between;gap:12px;margin-top:12px}

    .receive-section{background:var(--bg);padding:16px;border-radius:12px;border:1px dashed var(--line)}

    .chart-placeholder{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);height:200px;display:flex;align-items:center;justify-content:center}

    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="logo">₹ Cashex</div>
      <button class="button secondary logout" id="logout-button">Log out</button>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Top Balance Section -->
      <div class="dashboard-top">
        <div class="balance-card">
          <div class="balance-label">Total Balance</div>
          <div class="balance-amount" id="available-balance">$1,200.00</div>
          <div class="balance-footer">
            <div class="balance-footer-item">
              This Month
              <strong id="monthly-activity">$0.00</strong>
            </div>
            <div class="balance-footer-item">
              Account Status
              <strong id="account-status-badge" style="color:#10b981">Verified</strong>
            </div>
            <div class="balance-footer-item">
              User
              <strong id="user-name-badge">John Doe</strong>
            </div>
          </div>
        </div>

        <div class="quick-stats">
          <div class="stat-box sent">
            <div class="stat-label">Total Sent</div>
            <div class="stat-value" id="total-sent">$0.00</div>
          </div>
          <div class="stat-box received">
            <div class="stat-label">Total Received</div>
            <div class="stat-value" id="total-received">$0.00</div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-grid">
        <!-- Left: Transaction Form & History -->
        <section>
          <!-- Tabs -->
          <div class="tabs">
            <button class="tab active" data-tab="send">Send Money</button>
            <button class="tab" data-tab="receive">Receive Payment</button>
            <button class="tab" data-tab="history">History</button>
          </div>

          <!-- Send Tab -->
          <div id="send-tab" class="tab-content card" style="display:block">
            <h3>Send Money</h3>
            <form id="transfer-form" class="transfer-form">
              <div class="row">
                <div class="field" style="flex:1">
                  <label>From Currency</label>
                  <select id="from-currency">
                    <option>USD</option>
                    <option>EUR</option>
                    <option>GBP</option>
                    <option>PKR</option>
                    <option>AED</option>
                  </select>
                </div>
                <div class="field" style="flex:1">
                  <label>To Currency</label>
                  <select id="to-currency">
                    <option>PKR</option>
                    <option>USD</option>
                    <option>EUR</option>
                    <option>GBP</option>
                    <option>AED</option>
                  </select>
                </div>
              </div>

              <div class="field">
                <label>Amount</label>
                <input id="amount" type="number" min="0" step="0.01" value="100">
              </div>

              <div class="field">
                <label>Payment Method</label>
                <div style="display:flex;gap:16px;margin-top:8px">
                  <label style="display:flex;align-items:center;gap:8px;margin:0">
                    <input type="radio" name="method" value="card" checked>
                    <span style="font-size:13px">Card</span>
                  </label>
                  <label style="display:flex;align-items:center;gap:8px;margin:0">
                    <input type="radio" name="method" value="bank">
                    <span style="font-size:13px">Bank</span>
                  </label>
                </div>
              </div>

              <div id="card-fields">
                <div class="field">
                  <label>Card Number</label>
                  <input id="card-number" placeholder="4444 3333 2222 1111">
                </div>
                <div class="row">
                  <div class="field" style="flex:1">
                    <label>Expiry (MM/YY)</label>
                    <input id="card-exp" placeholder="08/28">
                  </div>
                  <div class="field" style="flex:1">
                    <label>CVC</label>
                    <input id="card-cvc" placeholder="123">
                  </div>
                </div>
                <div class="field">
                  <label>Name on Card</label>
                  <input id="card-name">
                </div>
              </div>

              <div id="bank-fields" style="display:none">
                <div class="field">
                  <label>Bank Name</label>
                  <input id="bank-name" placeholder="Bank of Example">
                </div>
                <div class="field">
                  <label>Account / IBAN</label>
                  <input id="bank-account" placeholder="PK12EXAM...">
                </div>
                <div class="field">
                  <label>Country</label>
                  <input id="bank-country" placeholder="Pakistan">
                </div>
              </div>

              <div class="field">
                <label>Recipient Name</label>
                <input id="recipient-name" placeholder="Full name">
              </div>

              <div class="field">
                <label>Notes</label>
                <textarea id="notes" rows="2" placeholder="What is this payment for?"></textarea>
              </div>

              <div class="field" style="display:flex;justify-content:space-between;align-items:center">
                <div style="font-size:13px">
                  Rate: <strong id="rateText" style="color:var(--primary)">1 USD = 278.50 PKR</strong>
                </div>
                <button type="button" id="verify-button" class="button secondary">Verify</button>
              </div>

              <button type="button" id="send-button" class="button primary" style="width:100%;padding:14px">Send Money</button>
              <div id="message" style="margin-top:12px;font-size:13px"></div>
            </form>
          </div>

          <!-- Receive Tab -->
          <div id="receive-tab" class="tab-content card" style="display:none">
            <h3>Receive Payment</h3>
            <div class="receive-section">
              <div class="mini-form">
                <div class="field">
                  <label>Payer Name</label>
                  <input id="receive-name" placeholder="Who is sending?">
                </div>
                <div class="row">
                  <div class="field" style="flex:1">
                    <label>Amount</label>
                    <input id="receive-amount" type="number" min="0" step="0.01" value="250">
                  </div>
                  <div class="field" style="flex:1">
                    <label>Currency</label>
                    <select id="receive-currency">
                      <option>USD</option>
                      <option>EUR</option>
                      <option>GBP</option>
                      <option>PKR</option>
                      <option>AED</option>
                    </select>
                  </div>
                </div>
                <div class="field">
                  <label>Notes</label>
                  <textarea id="receive-notes" rows="2" placeholder="Invoice or reference"></textarea>
                </div>
                <div class="mini-actions" style="justify-content:flex-end">
                  <button type="button" id="receive-payment-button" class="button success">Record Payment</button>
                </div>
              </div>
            </div>
          </div>

          <!-- History Tab -->
          <div id="history-tab" class="tab-content card" style="display:none">
            <h3>Transaction History</h3>
            <div class="history-filters">
              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="sent">Sent</button>
              <button class="filter-btn" data-filter="received">Received</button>
            </div>
            <div class="transaction-list" id="transaction-history-container">
              <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p>No transactions yet</p>
              </div>
            </div>
          </div>
        </section>

        <!-- Right: Recent Activity -->
        <aside>
          <div class="card">
            <h3>Recent Activity</h3>
            <div class="transaction-list" id="recent-transactions" style="max-height:500px">
              <div class="empty-state" style="padding:20px">
                <p>No transactions</p>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const config = window.CASHEXC_CONFIG || {};
    const supabaseUrl = config.supabaseUrl;
    const supabaseAnonKey = config.supabaseAnonKey;

    const STORAGE_KEY = 'cashex_transaction_history';
    const BALANCE_KEY = 'cashex_balance';

    const mockRates = {
      'USD:PKR': 278.5, 'USD:EUR': 0.92, 'EUR:USD': 1.09, 'USD:GBP': 0.78,
      'GBP:USD': 1.28, 'USD:AED': 3.67, 'PKR:USD': 0.0036, 'AED:USD': 0.27
    };

    function getRate(from, to) {
      if (from === to) return 1;
      const key = `${from}:${to}`;
      if (mockRates[key]) return mockRates[key];
      const inv = `${to}:${from}`;
      if (mockRates[inv]) return 1 / mockRates[inv];
      return 1;
    }

    let demoBalanceUSD = 1200.00;
    let demoUser = { id: '1', name: 'John Doe', email: 'john@cashex.com', status: 'Verified' };
    let transactionHistory = [
      { id: 1, type: 'received', amount: 150, currency: 'USD', from: 'Alice Smith', date: new Date(Date.now() - 2*24*60*60*1000), method: 'bank', description: 'Payment for services' },
      { id: 2, type: 'sent', amount: 500, currency: 'PKR', to: 'Ahmed Khan', date: new Date(Date.now() - 5*24*60*60*1000), method: 'card', description: 'Family support' },
      { id: 3, type: 'received', amount: 75.50, currency: 'EUR', from: 'Sarah Johnson', date: new Date(Date.now() - 7*24*60*60*1000), method: 'bank', description: 'Freelance work' }
    ];
    let currentFilter = 'all';

    // DOM Elements
    const availableBalanceEl = document.getElementById('available-balance');
    const totalSentEl = document.getElementById('total-sent');
    const totalReceivedEl = document.getElementById('total-received');
    const monthlyActivityEl = document.getElementById('monthly-activity');
    const userNameBadgeEl = document.getElementById('user-name-badge');
    const accountStatusEl = document.getElementById('account-status-badge');
    const amountEl = document.getElementById('amount');
    const fromCurrencyEl = document.getElementById('from-currency');
    const toCurrencyEl = document.getElementById('to-currency');
    const rateText = document.getElementById('rateText');
    const verifyButton = document.getElementById('verify-button');
    const sendButton = document.getElementById('send-button');
    const messageEl = document.getElementById('message');
    const historyContainerEl = document.getElementById('transaction-history-container');
    const recentTransactionsEl = document.getElementById('recent-transactions');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const receivePaymentButton = document.getElementById('receive-payment-button');
    const methodRadios = document.querySelectorAll('input[name="method"]');
    const cardFields = document.getElementById('card-fields');
    const bankFields = document.getElementById('bank-fields');
    const logoutButton = document.getElementById('logout-button');
    const tabs = document.querySelectorAll('.tab');

    function loadPersistedState() {
      try {
        const storedHistory = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (Array.isArray(storedHistory) && storedHistory.length) {
          transactionHistory = storedHistory.map(tx => ({ ...tx, date: new Date(tx.date) }));
        }
        const savedBalance = Number(localStorage.getItem(BALANCE_KEY));
        if (!Number.isNaN(savedBalance)) {
          demoBalanceUSD = savedBalance;
        }
      } catch (e) {
        console.warn('Could not load saved data', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(transactionHistory));
        localStorage.setItem(BALANCE_KEY, String(demoBalanceUSD));
      } catch (e) {
        console.warn('Could not save data', e);
      }
    }

    function updateRate() {
      const from = fromCurrencyEl.value;
      const to = toCurrencyEl.value;
      const rate = getRate(from, to);
      rateText.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;
    }

    function refreshBalanceDisplay() {
      availableBalanceEl.textContent = `$${demoBalanceUSD.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
      updateTransactionStats();
    }

    function updateTransactionStats() {
      let totalSent = 0, totalReceived = 0, monthlyActivity = 0;
      const monthAgo = new Date();
      monthAgo.setMonth(monthAgo.getMonth() - 1);

      transactionHistory.forEach(tx => {
        const amount = Number(tx.amount || 0);
        if (tx.type === 'sent') {
          totalSent += amount;
          if (new Date(tx.date) > monthAgo) monthlyActivity -= amount;
        } else {
          totalReceived += amount;
          if (new Date(tx.date) > monthAgo) monthlyActivity += amount;
        }
      });

      totalSentEl.textContent = `$${totalSent.toLocaleString('en-US', {minimumFractionDigits:2})}`;
      totalReceivedEl.textContent = `$${totalReceived.toLocaleString('en-US', {minimumFractionDigits:2})}`;
      monthlyActivityEl.textContent = `${monthlyActivity >= 0 ? '+' : ''}$${monthlyActivity.toLocaleString('en-US', {minimumFractionDigits:2})}`;
    }

    function renderTransactionHistory() {
      let filtered = currentFilter === 'all' ? transactionHistory : transactionHistory.filter(tx => tx.type === currentFilter);

      if (filtered.length === 0) {
        historyContainerEl.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p>No transactions</p>
          </div>
        `;
        return;
      }

      historyContainerEl.innerHTML = filtered.map(tx => {
        const isSent = tx.type === 'sent';
        const dateStr = new Date(tx.date).toLocaleDateString();
        const party = isSent ? tx.to : tx.from;
        return `
          <div class="transaction-item">
            <div class="tx-icon ${tx.type}">${isSent ? '↗' : '↙'}</div>
            <div class="tx-info">
              <div class="tx-name">${party}</div>
              <div class="tx-desc">${tx.description}</div>
              <div class="tx-date">${dateStr}</div>
            </div>
            <div class="tx-amount ${tx.type}">
              <div class="tx-amount-value">${isSent ? '−' : '+'}${Number(tx.amount).toFixed(2)}</div>
              <div class="tx-currency">${tx.currency}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRecentTransactions() {
      const recent = transactionHistory.slice(0, 5);
      if (recent.length === 0) {
        recentTransactionsEl.innerHTML = '<div class="empty-state" style="padding:20px"><p>No activity</p></div>';
        return;
      }

      recentTransactionsEl.innerHTML = recent.map(tx => {
        const isSent = tx.type === 'sent';
        const party = isSent ? tx.to : tx.from;
        return `
          <div class="transaction-item">
            <div class="tx-icon ${tx.type}">${isSent ? '↗' : '↙'}</div>
            <div class="tx-info">
              <div class="tx-name">${party}</div>
              <div class="tx-desc">${tx.description}</div>
            </div>
            <div class="tx-amount ${tx.type}">
              <div class="tx-amount-value" style="font-size:12px">${isSent ? '−' : '+'}${Number(tx.amount).toFixed(2)}</div>
              <div class="tx-currency">${tx.currency}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Tab switching
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
        document.getElementById(tabName + '-tab').style.display = 'block';
      });
    });

    // Filter buttons
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTransactionHistory();
      });
    });

    fromCurrencyEl.addEventListener('change', updateRate);
    toCurrencyEl.addEventListener('change', updateRate);
    amountEl.addEventListener('input', () => { messageEl.textContent = ''; });

    methodRadios.forEach(r => r.addEventListener('change', () => {
      const isCard = document.querySelector('input[name="method"]:checked').value === 'card';
      cardFields.style.display = isCard ? '' : 'none';
      bankFields.style.display = isCard ? 'none' : '';
    }));

    function luhnCheck(number) {
      const digits = number.replace(/\s+/g, '').split('').reverse().map(d => parseInt(d,10));
      if (digits.some(isNaN)) return false;
      let sum = 0;
      for (let i=0;i<digits.length;i++){
        let d = digits[i];
        if (i % 2 === 1) {
          d = d * 2;
          if (d > 9) d -= 9;
        }
        sum += d;
      }
      return (sum % 10) === 0;
    }

    async function verifySource() {
      messageEl.textContent = '';
      const method = document.querySelector('input[name="method"]:checked').value;
      const from = fromCurrencyEl.value;
      const amount = parseFloat(amountEl.value) || 0;

      if (amount <= 0) {
        messageEl.innerHTML = '<span style="color:var(--danger)">Enter an amount > 0</span>';
        return false;
      }

      if (method === 'card') {
        const cardNumber = document.getElementById('card-number').value.trim();
        if (!luhnCheck(cardNumber)) {
          messageEl.innerHTML = '<span style="color:var(--danger)">Invalid card number</span>';
          return false;
        }
        const simulatedCardAvailable = 500 + (Math.random()*1000);
        messageEl.innerHTML = `<span style="color:var(--cyan)">✓ Card verified. Available: ${from} ${simulatedCardAvailable.toFixed(2)}</span>`;
        return simulatedCardAvailable >= amount;
      } else {
        const acc = document.getElementById('bank-account').value.trim();
        if (!acc || acc.length < 6) {
          messageEl.innerHTML = '<span style="color:var(--danger)">Invalid IBAN</span>';
          return false;
        }
        const simulatedAccountAvailable = 200 + (Math.random()*2000);
        messageEl.innerHTML = `<span style="color:var(--cyan)">✓ Account verified. Available: ${from} ${simulatedAccountAvailable.toFixed(2)}</span>`;
        return simulatedAccountAvailable >= amount;
      }
    }

    verifyButton.addEventListener('click', async () => {
      verifyButton.disabled = true;
      verifyButton.textContent = 'Verifying...';
      try {
        const ok = await verifySource();
        if (ok) {
          messageEl.innerHTML += '<div style="color:var(--success);margin-top:6px">✓ Sufficient funds</div>';
        } else {
          messageEl.innerHTML += '<div style="color:var(--danger);margin-top:6px">✗ Insufficient funds</div>';
        }
      } catch (e) {
        messageEl.innerHTML = `<span style="color:var(--danger)">Error: ${e.message}</span>`;
      } finally {
        verifyButton.disabled = false;
        verifyButton.textContent = 'Verify';
      }
    });

    function addTransaction(tx) {
      transactionHistory.unshift(tx);
      saveState();
      renderTransactionHistory();
      renderRecentTransactions();
      updateTransactionStats();
    }

    sendButton.addEventListener('click', async () => {
      messageEl.textContent = '';
      const amount = parseFloat(amountEl.value) || 0;
      const from = fromCurrencyEl.value;
      const to = toCurrencyEl.value;

      if (amount <= 0) {
        messageEl.innerHTML = '<span style="color:var(--danger)">Enter valid amount</span>';
        return;
      }

      const fromToUSD = getRate(from, 'USD');
      const requiredUSD = amount * fromToUSD;

      if (requiredUSD > demoBalanceUSD) {
        messageEl.innerHTML = '<span style="color:var(--danger)">Insufficient balance</span>';
        return;
      }

      demoBalanceUSD -= requiredUSD;
      saveState();
      refreshBalanceDisplay();

      const record = {
        id: Date.now(),
        type: 'sent',
        amount: amount,
        currency: from,
        to: document.getElementById('recipient-name').value || 'Unnamed',
        date: new Date(),
        method: document.querySelector('input[name="method"]:checked').value,
        description: document.getElementById('notes').value || 'Transfer'
      };

      addTransaction(record);
      messageEl.innerHTML = '<span style="color:var(--success)">✓ Transfer sent</span>';
      document.getElementById('transfer-form').reset();
    });

    receivePaymentButton.addEventListener('click', () => {
      const payerName = document.getElementById('receive-name').value.trim() || 'Payment';
      const amount = parseFloat(document.getElementById('receive-amount').value) || 0;
      const currency = document.getElementById('receive-currency').value;
      const notes = document.getElementById('receive-notes').value.trim() || 'Incoming payment';

      if (amount <= 0) {
        alert('Enter valid amount');
        return;
      }

      const payment = {
        id: Date.now(),
        type: 'received',
        amount: amount,
        currency: currency,
        from: payerName,
        date: new Date(),
        method: 'bank',
        description: notes
      };

      demoBalanceUSD += amount * getRate(currency, 'USD');
      saveState();
      addTransaction(payment);
      refreshBalanceDisplay();
      document.getElementById('receive-name').value = '';
      document.getElementById('receive-amount').value = '250';
      document.getElementById('receive-notes').value = '';
      messageEl.innerHTML = '<span style="color:var(--success)">✓ Payment recorded</span>';
    });

    if (!supabaseUrl || !supabaseAnonKey || supabaseUrl.includes('YOUR_') || supabaseAnonKey.includes('YOUR_')) {
      refreshBalanceDisplay();
    } else {
      const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
      (async function(){
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          window.location.href = 'login.html';
          return;
        }
        try {
          const { data, error } = await supabase.from('balances').select('currency,amount').eq('user_id', user.id).single();
          if (error) throw error;
          if (data && data.amount) {
            demoBalanceUSD = parseFloat(data.amount) || demoBalanceUSD;
          }
        } catch (e) {}
        refreshBalanceDisplay();
      })();

      logoutButton.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
      });
    }

    loadPersistedState();
    userNameBadgeEl.textContent = demoUser.name;
    accountStatusEl.textContent = demoUser.status;
    updateRate();
    refreshBalanceDisplay();
    renderTransactionHistory();
    renderRecentTransactions();
  </script>
</body>
</html>

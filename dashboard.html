<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Cashex</title><style>:root{--blue:#1769e0;--ink:#10243d;--muted:#63748a;--bg:#f5f8fc;--card:#fff;--line:#e5ebf3}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}.container{max-width:1100px;margin:auto;padding:0 22px}header{background:#081b33;color:#fff}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800}.logo span{color:#35c4d5}.button{padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:800;cursor:pointer}.logout{background:var(--blue);color:#fff;border-color:var(--blue)}main{padding:48px 0}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 45px #193b6514}.sub,.muted{color:var(--muted)}.stat{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="container nav"><a class="logo" href="index.html">Cash<span>ex</span></a><button id="logout" class="button logout">Log out</button></div></header><main><div class="container grid"><section class="card"><h1>Welcome to your dashboard</h1><p class="sub" id="account-email">Loading account...</p><div class="stat"><span>Account status</span><strong>Active</strong></div><div class="stat"><span>Available balance</span><strong>$0.00</strong></div><div class="stat"><span>Last transfer</span><strong>No transfers yet</strong></div></section><aside class="card"><h2>Quick actions</h2><p class="muted">Your account is ready for future transfer features.</p><a class="button" href="index.html">Back to home</a></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const config=window.CASHEXC_CONFIG||{};if(!config.supabaseUrl||!config.supabaseAnonKey||config.supabaseUrl.includes('YOUR_')||config.supabaseAnonKey.includes('YOUR_')){location.href='login.html'}else{const client=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey);client.auth.getUser().then(({data,error})=>{if(error||!data.user){location.href='login.html';return}document.getElementById('account-email').textContent=data.user.email||'Signed-in account'});document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();location.href='login.html'})}</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Login to Cashex.">
  <title>Login | Cashex</title>
  <style>
    :root{--navy:#081b33;--blue:#1769e0;--ink:#10243d;--muted:#63748a;--bg:#f5f8fc;--card:#fff;--line:#e5ebf3;--danger:#b42318;--radius:18px}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6} a{text-decoration:none;color:inherit}
    .container{max-width:520px;margin:0 auto;padding:0 22px}.header{background:rgba(8,27,51,.96);color:#fff}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800;letter-spacing:-.5px}.logo span{color:#35c4d5}.link{color:#d9e5f3;font-size:14px}.link:hover{color:#fff}
    main{padding:80px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 18px 45px rgba(25,59,101,.08)}h1{margin:0 0 8px;font-size:32px}.sub{margin:0 0 22px;color:var(--muted)}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:13px 14px;border:1px solid #cdd8e5;border-radius:9px;font:inherit}.field input:focus{outline:3px solid rgba(23,105,224,.12);border-color:var(--blue)}
    .button{width:100%;border:0;border-radius:10px;padding:14px 18px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer}.button:hover{background:#1255b8}.button:disabled{opacity:.7;cursor:not-allowed}
    .error{color:var(--danger);font-size:13px;margin-top:12px}.note{margin-top:16px;font-size:13px;color:var(--muted)}.center{display:flex;justify-content:center}.small{font-size:14px;color:var(--muted)}
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="logo" href="index.html">Cash<span>ex</span></a>
      <a class="link" href="signup.html">Create account</a>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="card">
        <h1>Welcome back</h1>
        <p class="sub">Sign in to manage your transfers and account details.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="button" type="submit">Sign in</button>
          <div id="message" class="error" aria-live="polite"></div>
        </form>

        <div class="note center"><a href="signup.html" class="small">Need an account? Create one</a></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const message = document.getElementById('message');
    const submitButton = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';

      const config = window.CASHEXC_CONFIG || {};
      const supabaseUrl = config.supabaseUrl;
      const supabaseAnonKey = config.supabaseAnonKey;

      if (!supabaseUrl || !supabaseAnonKey || supabaseUrl.includes('YOUR_') || supabaseAnonKey.includes('YOUR_')) {
        message.textContent = 'Supabase is not configured. Update supabase-config.js with your project URL and anon key.';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Signing in...';

      try {
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
        const { error } = await supabase.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value
        });

        if (error) throw error;

        window.location.href = 'dashboard.html';
      } catch (error) {
        message.textContent = error?.message || 'Unable to sign in. Please check your email and password.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
